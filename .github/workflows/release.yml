name: Release

# Push a tag like v0.1.0 and this builds the Windows installer and the portable exe and attaches them to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Build the Windows downloads
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Write a checksum list
        shell: pwsh
        run: |
          Set-Location dist
          Get-FileHash -Algorithm SHA256 *.exe | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Archipelago-YAML-Editor-Setup-*.exe
            dist/Archipelago-YAML-Editor-Portable-*.exe
            dist/SHA256SUMS.txt
