  <rect x="8" y="8" width="496" height="496" rx="64" fill="none" stroke="#353c48" stroke-width="6"/>
  <g transform="translate(0 -16)">
    <rect x="62"  y="62"  width="76" height="76" rx="12" fill="#ff6b6b"/>
    <rect x="148" y="148" width="76" height="76" rx="12" fill="#ffa24c"/>
    <rect x="218" y="234" width="76" height="76" rx="12" fill="#ffd84d"/>
    <rect x="218" y="320" width="76" height="76" rx="12" fill="#5ad48a"/>
    <rect x="218" y="406" width="76" height="76" rx="12" fill="#3fd0c9"/>
    <rect x="288" y="148" width="76" height="76" rx="12" fill="#5aa7ff"/>
    <rect x="374" y="62"  width="76" height="76" rx="12" fill="#a98bff"/>
  </g>
</svg>
