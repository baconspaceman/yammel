name: Feature request
description: An idea that would make the editor better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the feature. What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you tried or considered?
  - type: checkboxes
    id: optional
    attributes:
      label: This project's rule
      options:
        - label: I understand that nothing may become required (no account, key, login or extra program), so a feature that needs one has to stay optional.
          required: true
